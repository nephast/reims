name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a build manually from GitHub UI

jobs:
  build:
    name: EAS Build (Android APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build -p android --profile preview --non-interactive

      # The step above prints a download URL like:
      #   https://expo.dev/artifacts/eas/...apk
      # Open that URL on your phone to install the APK.
